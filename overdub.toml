# overdub pipeline config — flat keys override the defaults in overdub/config.py.
# Uncomment and edit any key to override.

# work_root = "work"
# output_dir = "out"        # named final MKVs: "<title> [<video id>].mkv"

# --- STT (faster-whisper) ---
# whisper_model = "large-v3"
# whisper_device = "cuda"
# whisper_compute_type = "float16"
# whisper_beam_size = 5     # decode beam for TRANSCRIBE — the stage AND --repair-asr share it,
#                           # deliberately (a window decoded at another width splices in a
#                           # different kind of artifact).
#   DO NOT SET THIS TO 1. Measured 2026-07-22 on the 6 fixture videos, 4 passes, counterbalanced
#   order (scripts/asr_probe.py): speed 1.17x at best and two of six videos got SLOWER, while the
#   TEXT moved further than the run-to-run floor on all six. What it costs is exactly what this
#   pipeline cannot afford: "Claude" became "Cloud" 23 times against 0 at beam 5 (the DECISIONS
#   2026-07-20 proper-noun class), commas became sentence-ending periods, and floor_ratio crossed
#   transcribe_floor_run_max on 2 of 6 — which fires the alignment guard and re-runs ASR, costing
#   more than the lever saves. Changing this changes source text: it is in asr_key, so a workdir
#   transcribed under another key is WARNED about, not silently re-used and not refused.
# whisper_condition_on_previous = true   # context → proper punctuation; false only if a
#                                        # source makes whisper loop on repeats
#   NOTE 2026-07-19: 4szRHy_CT7s was re-transcribed with this set to FALSE — that source
#   loops on repeats (170 degenerate 0.02s word stamps, 2 duplicate sentence pairs, one
#   slot at 294 char/s → atempo ×8.79). With it off: 0 degenerate, 0 dups, max 24 char/s,
#   and no overlong terminator-free blocks came back. Per-source escape hatch, not a default.
#   CONFIRMED 2026-07-24: this was n=1; a mirrored 4-repeat probe over 4szRHy_CT7s + the fixture
#   six (asr_probe.py --variant nocond, DECISIONS 2026-07-24) reproduced it — cond=True gives
#   70-119 stamps / max 294 ch/s here, cond=False 0 / 24, ranges disjoint across 4 repeats.
#   USING THE HATCH IS SAFE TO REVERT: cond is stamped into asr_key but is deliberately NOT
#   part of what the provenance guard refuses on (asr.asr_key_core), so restoring this file
#   after a cond=False transcribe leaves that workdir usable — it prints one [info] line
#   naming both configs. Only model / compute type / beam refuse.

# repair_window_min_sec = 8.0   # --repair-asr: widen a defect window to at least this many seconds.
#                               # NOT a free dial. Widening pulls unflagged neighbours into the
#                               # replaced range and overwrites them with the window's own reading:
#                               # measured once as a correction, once as a degradation (DECISIONS
#                               # 2026-07-20). Raise it → more audio to decode, bigger blast radius.
#                               # Lower it → the clip loses the context that makes re-ASR credible.
#                               # 8-18 s is the band the 7 manual repairs worked in — a reported
#                               # range, never a calibrated one.
#                               # (no max key — a window has no upper bound; see repair.widen)

# --- translation ---
# Produced at the seam, not in-process (README "Running", route B). What is configurable here is
# only the gate applied to a finished draft:
# translate_max_len_ratio = 3.0   # runaway guard: text_ru chars vs source
# latin_ratio_max = 0.30          # english-echo detector (Latin fraction of alpha chars)

# --- TTS engine selection ---
tts_engine = "silero"       # THE engine since 2026-07-25 (DECISIONS)
tts_voice = "eugene"        # silero-only; ear ranking 2026-07-19 on v5_5_ru: eugene + kseniya
                            # best, xenia good-but-slightly-unpleasant, aidar/baya have an
                            # off-standard accent that is harder to follow. "kseniya" = backup
# silero_model = "v5_5_ru"  # default; "v4_ru" only to reproduce pre-2026-07-19 runs
tts_sample_rate = 48000     # silero-only
# tts_seed = 42             # base seed for seed-capable engines; retries use seed+attempt
# tts_max_retries = 3       # reseed attempts after the first try (seed-capable engines only)

# --- dead-air / mix ---
# group_gap_max = 0.4        # join adjacent sentences into one render unit (s); 0.0 disables
# dub_mix = "bed"            # "replace" | "duck" | "bed" — production default: bed (no-vocals
                              # stem at original level under the dub; ear 2026-07-17)
# demucs_python = ".venv-demucs/Scripts/python.exe"

# --- verification (whisper-small round-trip) ---
# verify_model = "small"
# verify_compute_type = "float16"   # the round-trip verifier's compute type. Independent of
#                                   # whisper_compute_type ON PURPOSE: the instrument must not
#                                   # move with the thing it measures, or a transcribe-speed
#                                   # experiment reads its own measurement error as a result.
#                                   # Same value as the transcriber today, so an unchanged file
#                                   # resolves both roles identically. Verify's beam is NOT a key
#                                   # at all (asr.VERIFY_BEAM_SIZE), for the same reason.
# similarity_threshold = 0.9              # unit-level gate (long joined strings score high;
                                          # raised from the per-sentence 0.8 on 2026-07-17)
# similarity_threshold_compressed = 0.9   # stricter gate for natively compressed units
